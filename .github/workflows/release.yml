name: Release

# Push a tag like v0.8.0 (matching Info.json "version") to publish a release.
# IINA's "Install from GitHub" and its update check use the .iinaplgz attached to the
# latest release, and compare "ghVersion" in Info.json on main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Check versions
        run: mise run release:verify
      - name: Lint and type-check
        run: mise run check
      - name: Build and package
        run: mise run pack
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.iinaplgz --title "$GITHUB_REF_NAME" --generate-notes
